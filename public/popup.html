<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>备货清单工具</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 12px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 600;
        border: 2px solid #18181b;
        background: #18181b;
        color: #fff;
        border-radius: 0;
      }
      button:hover {
        background: #000;
      }
      p {
        margin: 0 0 10px;
        font-size: 12px;
        color: #52525b;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <p>主界面在独立标签页中打开，便于编辑与导出。</p>
    <button type="button" id="openOptions">打开备货工具</button>
    <script src="popup.js"></script>
  </body>
</html>
